name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 5
